# Blueprint do Render: cria a base de dados PostgreSQL e o back-end de uma vez.
# No Render: New → Blueprint → escolhe este repositório.
databases:
  - name: a-mesa-db
    plan: free
    databaseName: a_mesa

services:
  - type: web
    name: a-mesa-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: a-mesa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Código para criar a 1.ª conta (admin). Vê o valor em Environment depois do deploy.
      - key: CODIGO_CONFIGURACAO
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Europe/Lisbon
      # URL do front-end no Vercel (ex.: https://tasca-do-ze.vercel.app) — obrigatório
      - key: FRONTEND_URL
        sync: false
      # Email para a recuperação de senha (ex.: smtps://utilizador:senha-de-app@smtp.gmail.com:465)
      - key: SMTP_URL
        sync: false
      - key: EMAIL_REMETENTE
        value: Tasca do Zé <no-reply@tascadoze.pt>
      # Opcional, mas recomendado: o disco do Render apaga-se a cada deploy
      - key: CLOUDINARY_URL
        sync: false
