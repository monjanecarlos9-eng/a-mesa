# Blueprint do Render: cria os 3 serviços de uma vez (base de dados, API e site).
# No Render: New → Blueprint → escolhe este repositório → Apply.
#
# Endereços previstos (se o nome já estiver ocupado, o Render acrescenta letras — ver README):
#   site → https://a-mesa-tasca.onrender.com
#   API  → https://a-mesa-tasca-api.onrender.com
databases:
  - name: a-mesa-db
    plan: free
    databaseName: a_mesa

services:
  # ---------- API (Express + Socket.IO) ----------
  - type: web
    name: a-mesa-tasca-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    # Migrações + dados de exemplo (idempotente) e arranque
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: a-mesa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Código para criar a 1.ª conta (admin) num site sem contas de teste
      - key: CODIGO_CONFIGURACAO
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Europe/Lisbon
      # Endereço do site (CORS e links de recuperação de senha)
      - key: FRONTEND_URL
        value: https://a-mesa-tasca.onrender.com
      # Contas de teste para a avaliação, com senhas ALEATÓRIAS geradas pelo Render
      # (vê-as em a-mesa-tasca-api → Environment e dá-as ao professor em privado)
      - key: SEED_DEMO
        value: '1'
      - key: DEMO_SENHA_ADMIN
        generateValue: true
      - key: DEMO_SENHA_COZINHA
        generateValue: true
      # Opcional — email para a recuperação de senha (ex.: smtps://utilizador:senha-de-app@smtp.gmail.com:465)
      - key: SMTP_URL
        sync: false
      - key: EMAIL_REMETENTE
        value: Tasca do Zé <no-reply@tascadoze.pt>
      # Opcional — fotos dos pratos (o disco do plano grátis apaga-se a cada deploy)
      - key: CLOUDINARY_URL
        sync: false

  # ---------- Site (React compilado, ficheiros estáticos) ----------
  - type: web
    name: a-mesa-tasca
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_URL
        value: https://a-mesa-tasca-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
